:root{--sans:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;--serif:Georgia,'Times New Roman',serif;--navy:#0B1B2E;--blue:#1F5A8C;--blue-d:#174669;--bg:#F4F6F9;--card:#fff;--line:#D5DDE6;--mute:#5B6B7D;--soft:#EAF1F8;--err:#B3261E}

html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--navy);line-height:1.6;font-size:16px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0}
.brand{display:flex;align-items:center;gap:12px;min-width:0}

.lang button{border:0;background:none;font:500 13px var(--sans);padding:8px 14px;min-height:40px;color:var(--mute);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--navy);color:#fff}
.hero{background:var(--navy);color:#fff;border-radius:18px;padding:36px 28px;margin-bottom:20px}
.hero h1{font:600 clamp(26px,6vw,36px)/1.2 var(--serif);margin-bottom:12px}

.hero .txt{font-size:14px;color:#AFC4D9;font-weight:300;max-width:56ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 22px}
.prog{height:4px;background:var(--line);border-radius:4px;margin:0 0 8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue);transition:width .3s}
.stepno{font-size:13px;color:var(--mute);margin-bottom:18px}
h2{font:600 22px/1.3 var(--serif);margin-bottom:4px}
.lead{color:var(--mute);font-size:14px;margin-bottom:22px}
.f{margin-bottom:22px;border:0}
.f>label,.f>legend{display:block;font-weight:500;font-size:15px;margin-bottom:8px}
.opt-tag{font-weight:300;color:var(--mute);font-size:13px;margin-left:6px}
.req{color:var(--blue);font-weight:600}
input[type=text],textarea{width:100%;font:400 16px var(--sans);color:var(--navy);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff}
textarea{min-height:96px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,.opt input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts.list{flex-direction:column}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.opt span{display:block;border:1.5px solid var(--line);border-radius:10px;padding:11px 16px;font-size:14px;background:#fff;min-height:44px}
.opts.list .opt span{padding:13px 16px}
.opt small{display:block;color:var(--mute);font-size:12.5px;font-weight:300}
.opt input:checked+span{border-color:var(--blue);background:var(--soft);font-weight:500}
.hint{font-size:13px;color:var(--mute);background:var(--soft);border-radius:10px;padding:12px 14px;margin-bottom:22px}
.priv{font-size:13px;color:var(--mute);border-left:3px solid var(--blue);padding:4px 0 4px 14px;margin-bottom:14px}.priv summary{cursor:pointer;font-weight:500;color:var(--navy);font-size:14px}.priv p{margin-top:8px}

.consent input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--blue)}
.err{color:var(--err);font-size:13px;margin-top:6px;min-height:0}
.invalid input[type=text]{border-color:var(--err)}
.nav{display:flex;gap:10px;margin-top:8px}
.btn{font:500 16px var(--sans);border-radius:10px;border:0;padding:14px 22px;min-height:48px;cursor:pointer;flex:1}
.btn.p{background:var(--blue);color:#fff}.btn.p:hover{background:var(--blue-d)}
.btn.s{background:#fff;color:var(--navy);border:1.5px solid var(--line);flex:.6}
.btn:disabled{opacity:.6;cursor:wait}
.alert{background:#FDECEA;color:var(--err);border-radius:10px;padding:14px;font-size:14px;margin-bottom:14px}
.alert a{color:var(--err);font-weight:500}
.done{text-align:center;padding:40px 12px}
.done .mono{margin:0 auto 18px;width:56px;height:56px}
.done p{color:var(--mute);max-width:44ch;margin:10px auto 22px}
.foot{text-align:center;font-size:12px;color:var(--mute);margin-top:22px}
.hp{position:absolute;left:-9999px}
@media(max-width:480px){.hero{padding:28px 20px}.card{padding:22px 16px}.brand span{display:none}.nav{flex-direction:column-reverse}.btn.s{flex:1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function collect(){
 document.querySelectorAll('#form [name]').forEach(e=>{
  const k=e.name;
  if(e.type==='radio'){ if(e.checked) D[k]=e.value; }

 });
}

function field(f){
 const l=f.l?f.l[li()]:"", req=f.req?' <span class="req" aria-hidden="true">*</span>':'', tag=(!f.req&&f.ty!=='priv'&&(f.ty==='text'||f.ty==='area'))?`<span class="opt-tag">(${T[L].optional})</span>`:'';
 const er=errs[f.k]?`<div class="err" role="alert">${esc(errs[f.k])}</div>`:'';
 if(f.ty==='hint') return `<div class="hint">${T[L].mailHint}</div>`;
 if(f.ty==='priv') return `<details class="priv"><summary>${T[L].privSum}</summary>${T[L].priv()}</details>
  <div class="f ${errs.consent?'invalid':''}"><label class="consent"><input type="checkbox" name="consent" ${D.consent?'checked':''}><span>${T[L].consent} <span class="req" aria-hidden="true">*</span></span></label>${errs.consent?`<div class="err" role="alert">${esc(errs.consent)}</div>`:''}</div>`;
 if(f.ty==='text') return `<div class="f ${errs[f.k]?'invalid':''}"><label for="${f.k}">${l}${req} ${tag}</label><input type="text" id="${f.k}" name="${f.k}" value="${esc(D[f.k])}" placeholder="${esc(f.ph[li()])}" ${f.ac?`autocomplete="${f.ac}"`:''} ${f.k==='contact'?'inputmode="email"':''} ${f.req?'aria-required="true"':''}>${er}</div>`;
 if(f.ty==='area') return `<div class="f"><label for="${f.k}">${l} ${tag}</label><textarea id="${f.k}" name="${f.k}" placeholder="${esc(f.ph[li()])}">${esc(D[f.k])}</textarea></div>`;
 const O=getO(f), many=f.ty==='many', list=O.some(o=>o.length>3);
 const opts=O.map(o=>{
  const ck=many?(D[f.k]||[]).includes(o[0]):D[f.k]===o[0];
  return `<label class="opt"><input type="${many?'checkbox':'radio'}" name="${f.k}" value="${o[0]}" ${many?'data-m="1"':''} ${ck?'checked':''}><span>${esc(o[1+li()])}${o[3]?`<small>${esc(o[3+li()])}</small>`:''}</span></label>`;
 }).join('');
 return `<fieldset class="f"><legend>${l}${req}</legend><div class="opts ${list?'list':''}">${opts}</div>${er}</fieldset>`;
}

function render(){
 const t=T[L]; document.documentElement.lang=L;
 const head=`<div class="top"><div class="brand"><div class="mono" aria-hidden="true">NB</div><div><b>Nikola Biban | ${t.role}</b><span>${t.foot.split('·')[1].trim()}</span></div></div>
  <div class="lang" role="group" aria-label="Jazyk / Limba"><button type="button" data-l="cs" aria-pressed="${L==='cs'}">CZ</button><button type="button" data-l="ro" aria-pressed="${L==='ro'}">RO</button></div></div>`;
 let body='';
 if(state==='manual'){
  body=`<div class="card done"><div class="mono" aria-hidden="true">NB</div><h2>${t.manH}</h2><p>${t.manP}</p><p><b>${EMAIL}</b></p><div class="nav"><a class="btn p" style="text-align:center;text-decoration:none" href="${mailLink()}">${t.openMail}</a><button class="btn s" id="copy" type="button">${t.copyMsg}</button></div><p><button class="btn s" id="again" type="button" style="flex:none">${t.again}</button></p></div>`;
 } else if(state==='done'){
  body=`<div class="card done"><div class="mono" aria-hidden="true">✓</div><h2>${t.okH}</h2><p>${t.okP}</p><button class="btn s" id="again" type="button" style="flex:none">${t.again}</button></div>`;
 } else {
  const S=STEPS[step];
  body=`<div class="hero"><h1>${t.h1}</h1><p class="sub">${t.sub}</p><p class="txt">${t.txt}</p></div>
  <form class="card" id="form" novalidate>
   <div class="prog" aria-hidden="true"><i style="width:${(step+1)/STEPS.length*100}%"></i></div>
   <div class="stepno">${t.step(step+1,STEPS.length)}${step===0?' · '+t.time:''}</div>
   <h2>${S.t[li()]}</h2><p class="lead">${S.s[li()]}</p>
   ${S.f.map(field).join('')}
   <div class="nav">${step>0?`<button class="btn s" type="button" id="back">${t.back}</button>`:''}<button class="btn p" type="submit" id="go" ${busy?'disabled':''}>${busy?t.sending:(step===STEPS.length-1?t.send:t.next)}</button></div>
  </form>`;
 }
 $('#app').innerHTML=head+body+`<p class="foot">${t.foot}</p>`;
}

/* ===== VALIDACE ===== */
const isMail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v), isTel=v=>/^\+?[\d\s()\-]{9,}$/.test(v);
function validate(){
 errs={};
 if(step===0){ if(!D.ctype) errs.ctype=T[L].eType; if(!D.name) errs.name=T[L].eName; }
 if(step===STEPS.length-1){
  if(!(isMail(D.contact||'')||isTel(D.contact||''))) errs.contact=T[L].eContact;
  if(!D.consent) errs.consent=T[L].eConsent;
 }
 return !Object.keys(errs).length;
}

/* ===== SHRNUTÍ (vždy česky pro příjemce) ===== */
function rows(){
 const out=[]; STEPS.forEach(S=>S.f.forEach(f=>{
  if(f.ty==='priv'||f.ty==='hint') return;
  let v=D[f.k]; if(f.o){ const O=getO(f); v=f.ty==='many'?(v||[]).map(x=>(O.find(o=>o[0]===x)||[])[1]).filter(Boolean).join(', '):(O.find(o=>o[0]===v)||[])[1]; }
  out.push([f.l[0],v||'—']);
 })); return out;
}
const summary=()=>T[L].intro+'\n\n'+rows().map(r=>r.join(': ')).join('\n');
const mailLink=()=>`mailto:${EMAIL}?subject=${encodeURIComponent('Dotazník – nový klient: '+(D.name||''))}&body=${encodeURIComponent(summary())}`;

/* ===== ODESLÁNÍ ===== */
function submit(){ state='manual'; render(); window.scrollTo({top:0,behavior:'smooth'}); }

/* ===== UDÁLOSTI ===== */
document.addEventListener('click',e=>{
 const lb=e.target.closest('[data-l]');
 if(lb){ if(state==='form') collect(); L=lb.dataset.l; errs={}; render(); return; }
 if(e.target.id==='back'){ collect(); errs={}; step--; render(); window.scrollTo({top:0,behavior:'smooth'}); }
 if(e.target.id==='copy'){ navigator.clipboard.writeText(summary()).then(()=>{e.target.textContent=T[L].copied}).catch(()=>{}); }
 if(e.target.id==='again'){ D={}; step=0; state='form'; failed=false; errs={}; render(); }
});
document.addEventListener('submit',e=>{
 e.preventDefault(); collect();
 if(!validate()){ render(); const el=document.querySelector('.err'); if(el) el.scrollIntoView({block:'center',behavior:'smooth'}); return; }
 if(step<STEPS.length-1){ step++; render(); window.scrollTo({top:0,behavior:'smooth'}); }
 else submit();
});
render();
</script>
</body>
</html>
